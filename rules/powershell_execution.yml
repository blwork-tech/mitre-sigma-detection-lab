title: Detection Lab - PowerShell Execution
id: 11111111-1111-4111-8111-111111111111
status: experimental
description: Detects PowerShell process creation for detection engineering lab validation.
author: BL
date: 2026-10-07

logsource:
    category: process_creation
    product: windows

detection:
    selection:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    condition: selection

falsepositives:
    - Legitimate system administration
    - Developer activity
    - Automated management scripts

level: low

tags:
    - attack.execution
    - attack.t1059.001